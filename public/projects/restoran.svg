<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="restBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="restAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#restBg)" />
  <circle cx="150" cy="120" r="140" fill="#4338CA" opacity="0.3" />
  <circle cx="700" cy="400" r="150" fill="#D97706" opacity="0.2" />

  <!-- Java Swing Desktop Window Mockup -->
  <rect x="80" y="60" width="640" height="380" rx="10" fill="#0F172A" stroke="#C4B5FD" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Window Header Bar (Classic Java Desktop Feel with modern look) -->
  <rect x="80" y="60" width="640" height="38" rx="10" fill="#1E1B4B" />
  <circle cx="102" cy="79" r="6" fill="#EF4444" />
  <circle cx="120" cy="79" r="6" fill="#F59E0B" />
  <circle cx="138" cy="79" r="6" fill="#10B981" />
  <text x="165" y="84" fill="#DDD6FE" font-family="sans-serif" font-size="12" font-weight="bold">RestoPOS v2.1 [Java Standard Edition + MySQL JDBC]</text>

  <!-- Left: Menu Selector Grid -->
  <rect x="100" y="115" width="370" height="305" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="115" y="140" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Kategori Menu Masakan</text>

  <!-- Menu Item Card 1 -->
  <rect x="115" y="155" width="165" height="70" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.4" />
  <circle cx="140" cy="190" r="16" fill="url(#restAccent)" />
  <text x="135" y="195" fill="#ffffff" font-size="14">☕</text>
  <text x="165" y="180" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Kopi Robusta</text>
  <text x="165" y="200" fill="#FDE68A" font-family="sans-serif" font-size="10">Rp 18.000</text>

  <!-- Menu Item Card 2 -->
  <rect x="290" y="155" width="165" height="70" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.4" />
  <circle cx="315" cy="190" r="16" fill="#8B5CF6" />
  <text x="310" y="195" fill="#ffffff" font-size="14">🍜</text>
  <text x="340" y="180" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Mie Goreng</text>
  <text x="340" y="200" fill="#FDE68A" font-family="sans-serif" font-size="10">Rp 25.000</text>

  <!-- Menu Item Card 3 -->
  <rect x="115" y="235" width="165" height="70" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.4" />
  <circle cx="140" cy="270" r="16" fill="#10B981" />
  <text x="135" y="275" fill="#ffffff" font-size="14">🍗</text>
  <text x="165" y="260" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Ayam Bakar</text>
  <text x="165" y="280" fill="#FDE68A" font-family="sans-serif" font-size="10">Rp 32.000</text>

  <!-- Menu Item Card 4 -->
  <rect x="290" y="235" width="165" height="70" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.4" />
  <circle cx="315" cy="270" r="16" fill="#EC4899" />
  <text x="310" y="275" fill="#ffffff" font-size="14">🍹</text>
  <text x="340" y="260" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Jus Alpukat</text>
  <text x="340" y="280" fill="#FDE68A" font-family="sans-serif" font-size="10">Rp 15.000</text>

  <!-- SQL Connection status badge -->
  <rect x="115" y="380" width="340" height="26" rx="4" fill="#047857" fill-opacity="0.3" stroke="#10B981" stroke-opacity="0.5" />
  <circle cx="130" cy="393" r="4" fill="#10B981" />
  <text x="142" y="397" fill="#A7F3D0" font-family="sans-serif" font-size="10">Connected to MySQL: localhost:3306/db_restaurant</text>

  <!-- Right: Cashier Receipt & Bill -->
  <rect x="490" y="115" width="210" height="305" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
  <text x="510" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Ringkasan Tagihan</text>
  
  <rect x="510" y="160" width="170" height="1" fill="#ffffff" fill-opacity="0.1" />

  <text x="510" y="185" fill="#DDD6FE" font-family="sans-serif" font-size="11">2x Mie Goreng</text>
  <text x="635" y="185" fill="#ffffff" font-family="sans-serif" font-size="11">50.000</text>

  <text x="510" y="210" fill="#DDD6FE" font-family="sans-serif" font-size="11">1x Ayam Bakar</text>
  <text x="635" y="210" fill="#ffffff" font-family="sans-serif" font-size="11">32.000</text>

  <text x="510" y="235" fill="#DDD6FE" font-family="sans-serif" font-size="11">2x Kopi Robusta</text>
  <text x="635" y="235" fill="#ffffff" font-family="sans-serif" font-size="11">36.000</text>

  <rect x="510" y="255" width="170" height="1" stroke="#ffffff" stroke-dasharray="4 2" fill="none" stroke-opacity="0.3" />

  <text x="510" y="280" fill="#DDD6FE" font-family="sans-serif" font-size="11">Subtotal:</text>
  <text x="630" y="280" fill="#ffffff" font-family="sans-serif" font-size="11">118.000</text>
  <text x="510" y="300" fill="#DDD6FE" font-family="sans-serif" font-size="11">Pajak (10%):</text>
  <text x="635" y="300" fill="#ffffff" font-family="sans-serif" font-size="11">11.800</text>

  <rect x="505" y="320" width="180" height="34" rx="6" fill="#ffffff" fill-opacity="0.08" />
  <text x="515" y="342" fill="#FCD34D" font-family="sans-serif" font-size="14" font-weight="bold">TOTAL: Rp 129.800</text>

  <rect x="505" y="365" width="180" height="38" rx="6" fill="url(#restAccent)" />
  <text x="545" y="389" fill="#1E1B4B" font-family="sans-serif" font-size="12" font-weight="bold">CETAK STRUK</text>
</svg>
