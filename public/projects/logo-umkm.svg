<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <linearGradient id="goldMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#artBg)" />
  <rect width="800" height="500" fill="url(#dotGrid)" />

  <!-- Illustrator Artboard Workspace Frame -->
  <rect x="70" y="50" width="660" height="400" rx="12" fill="#181329" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Illustrator top bar -->
  <rect x="70" y="50" width="660" height="34" rx="12" fill="#241B3B" />
  <text x="90" y="72" fill="#D8B4FE" font-family="sans-serif" font-size="11" font-weight="bold">Ai</text>
  <text x="115" y="72" fill="#ffffff" font-family="sans-serif" font-size="11">Brand_Identity_UMKM_Vector.ai @ 100% (CMYK/Preview)</text>

  <!-- Left: Toolbar -->
  <rect x="80" y="95" width="40" height="340" rx="6" fill="#241B3B" />
  <circle cx="100" cy="115" r="8" fill="#8B5CF6" />
  <rect x="92" y="135" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.2" />
  <rect x="92" y="165" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.2" />
  <rect x="92" y="195" width="16" height="16" rx="3" fill="url(#goldMark)" />
  <rect x="92" y="225" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.2" />
  <rect x="92" y="255" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.2" />

  <!-- Center: Artboard White Canvas -->
  <rect x="145" y="100" width="370" height="330" rx="8" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1" />
  
  <!-- Vector Grid & Guides -->
  <g stroke="#C4B5FD" stroke-opacity="0.3" stroke-dasharray="3 3">
    <line x1="330" y1="100" x2="330" y2="430" />
    <line x1="145" y1="265" x2="515" y2="265" />
    <circle cx="330" cy="240" r="80" fill="none" />
    <circle cx="330" cy="240" r="110" fill="none" />
  </g>

  <!-- Golden Elegant Logo Mark Created in Canvas -->
  <g transform="translate(330, 240)">
    <!-- Stylized emblem -->
    <path d="M 0 -60 C 35 -60, 60 -35, 60 0 C 60 40, 20 65, 0 80 C -20 65, -60 40, -60 0 C -60 -35, -35 -60, 0 -60 Z" fill="url(#purpleGlow)" opacity="0.9" />
    <circle cx="0" cy="0" r="38" fill="#FAF5FF" />
    <!-- Leaf/Crown motif in Gold -->
    <path d="M 0 -25 C 15 -10, 20 15, 0 25 C -20 15, -15 -10, 0 -25 Z" fill="url(#goldMark)" />
    <circle cx="0" cy="-3" r="7" fill="#4C1D95" />
    <!-- Vector Anchor Points -->
    <rect x="-63" y="-3" width="6" height="6" fill="#2563EB" stroke="#ffffff" stroke-width="1" />
    <rect x="57" y="-3" width="6" height="6" fill="#2563EB" stroke="#ffffff" stroke-width="1" />
    <rect x="-3" y="-63" width="6" height="6" fill="#2563EB" stroke="#ffffff" stroke-width="1" />
    <rect x="-3" y="77" width="6" height="6" fill="#2563EB" stroke="#ffffff" stroke-width="1" />
  </g>

  <text x="270" y="360" fill="#2E1065" font-family="serif" font-size="18" font-weight="bold" letter-spacing="3">LAVENDULA</text>
  <text x="288" y="380" fill="#7C3AED" font-family="sans-serif" font-size="9" letter-spacing="2">ARTISAN BOTANICALS</text>

  <!-- Right: Color Palette & Swatches Panel -->
  <rect x="535" y="100" width="180" height="330" rx="8" fill="#241B3B" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="550" y="125" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Color Swatches</text>
  
  <!-- Swatch 1 -->
  <rect x="550" y="140" width="30" height="30" rx="6" fill="#4C1D95" stroke="#ffffff" stroke-width="1" />
  <text x="590" y="155" fill="#DDD6FE" font-family="sans-serif" font-size="10" font-weight="bold">Deep Violet</text>
  <text x="590" y="167" fill="#9CA3AF" font-family="sans-serif" font-size="9">#4C1D95</text>

  <!-- Swatch 2 -->
  <rect x="550" y="180" width="30" height="30" rx="6" fill="#C084FC" stroke="#ffffff" stroke-width="1" />
  <text x="590" y="195" fill="#DDD6FE" font-family="sans-serif" font-size="10" font-weight="bold">Lavender Pastel</text>
  <text x="590" y="207" fill="#9CA3AF" font-family="sans-serif" font-size="9">#C084FC</text>

  <!-- Swatch 3 -->
  <rect x="550" y="220" width="30" height="30" rx="6" fill="#F59E0B" stroke="#ffffff" stroke-width="1" />
  <text x="590" y="235" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="bold">Champagne Gold</text>
  <text x="590" y="247" fill="#9CA3AF" font-family="sans-serif" font-size="9">#F59E0B</text>

  <!-- Mockup preview stamp -->
  <rect x="550" y="275" width="150" height="135" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="560" y="295" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Packaging Mockup</text>
  <!-- Coffee bag silhouette -->
  <rect x="585" y="310" width="80" height="90" rx="6" fill="#FAF5FF" />
  <circle cx="625" cy="345" r="14" fill="#8B5CF6" />
  <rect x="605" y="367" width="40" height="4" rx="2" fill="#D97706" />
  <text x="618" y="349" fill="#FCD34D" font-size="10">✦</text>
</svg>
