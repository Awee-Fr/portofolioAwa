<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  <circle cx="700" cy="80" r="140" fill="#8B5CF6" opacity="0.2" filter="url(#glow)" />
  <circle cx="100" cy="420" r="120" fill="#D97706" opacity="0.15" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Browser window mockup -->
  <rect x="90" y="70" width="620" height="360" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Browser top bar -->
  <rect x="90" y="70" width="620" height="42" rx="12" fill="#ffffff" fill-opacity="0.07" />
  <circle cx="118" cy="91" r="5" fill="#EF4444" />
  <circle cx="134" cy="91" r="5" fill="#F59E0B" />
  <circle cx="150" cy="91" r="5" fill="#10B981" />
  <rect x="180" y="81" width="300" height="20" rx="6" fill="#ffffff" fill-opacity="0.1" />
  <text x="240" y="95" fill="#DDD6FE" font-family="sans-serif" font-size="10" opacity="0.8">ppdb.sekolah-negeri.sch.id</text>

  <!-- Hero inside window -->
  <rect x="120" y="130" width="320" height="26" rx="6" fill="#8B5CF6" fill-opacity="0.3" />
  <text x="135" y="148" fill="#F5F3FF" font-family="sans-serif" font-size="14" font-weight="bold">Portal PPDB Online Terpadu</text>

  <rect x="120" y="170" width="260" height="12" rx="4" fill="#DDD6FE" fill-opacity="0.4" />
  <rect x="120" y="190" width="220" height="12" rx="4" fill="#DDD6FE" fill-opacity="0.25" />

  <!-- Multi-step bar -->
  <g transform="translate(120, 225)">
    <circle cx="15" cy="15" r="14" fill="#8B5CF6" />
    <text x="11" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
    <rect x="35" y="13" width="70" height="4" fill="#8B5CF6" />
    
    <circle cx="120" cy="15" r="14" fill="#8B5CF6" />
    <text x="116" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">2</text>
    <rect x="140" y="13" width="70" height="4" fill="url(#goldGrad)" />

    <circle cx="225" cy="15" r="14" fill="url(#goldGrad)" />
    <text x="221" y="20" fill="#1E1B4B" font-family="sans-serif" font-size="12" font-weight="bold">3</text>
    <rect x="245" y="13" width="70" height="4" fill="#ffffff" fill-opacity="0.2" />

    <circle cx="330" cy="15" r="14" fill="#ffffff" fill-opacity="0.2" />
    <text x="326" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">4</text>
  </g>

  <!-- Step cards -->
  <rect x="120" y="275" width="160" height="125" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.4" />
  <text x="135" y="302" fill="#DDD6FE" font-family="sans-serif" font-size="11" font-weight="bold">Data Siswa</text>
  <rect x="135" y="315" width="130" height="8" rx="3" fill="#ffffff" fill-opacity="0.2" />
  <rect x="135" y="330" width="100" height="8" rx="3" fill="#ffffff" fill-opacity="0.15" />
  <rect x="135" y="360" width="80" height="22" rx="4" fill="#10B981" fill-opacity="0.3" stroke="#10B981" />
  <text x="150" y="375" fill="#A7F3D0" font-family="sans-serif" font-size="10">Terverifikasi ✓</text>

  <rect x="300" y="275" width="160" height="125" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-opacity="0.6" />
  <text x="315" y="302" fill="#FCD34D" font-family="sans-serif" font-size="11" font-weight="bold">Unggah Berkas</text>
  <rect x="315" y="315" width="130" height="8" rx="3" fill="#ffffff" fill-opacity="0.2" />
  <rect x="315" y="330" width="115" height="8" rx="3" fill="#ffffff" fill-opacity="0.15" />
  <rect x="315" y="360" width="80" height="22" rx="4" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" />
  <text x="330" y="375" fill="#FDE68A" font-family="sans-serif" font-size="10">Proses Cek...</text>

  <!-- Right side summary widget -->
  <rect x="480" y="130" width="205" height="270" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15" />
  <text x="500" y="165" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Status Seleksi</text>
  <circle cx="582" cy="225" r="42" fill="none" stroke="#8B5CF6" stroke-width="8" stroke-dasharray="210 55" />
  <text x="565" y="232" fill="#FCD34D" font-family="sans-serif" font-size="18" font-weight="bold">92%</text>
  <text x="525" y="295" fill="#DDD6FE" font-family="sans-serif" font-size="11">Skor Kuota Jalur Zonasi</text>
  <rect x="505" y="325" width="155" height="34" rx="6" fill="#8B5CF6" fill-opacity="0.4" stroke="#C4B5FD" stroke-opacity="0.5" />
  <text x="530" y="347" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Unduh Bukti PDF</text>
</svg>
