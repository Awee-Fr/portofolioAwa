<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="50%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#mobBg)" />
  <circle cx="200" cy="400" r="160" fill="#9333EA" opacity="0.25" />
  <circle cx="600" cy="100" r="140" fill="#F59E0B" opacity="0.2" />

  <!-- Phone Mockup Center -->
  <g transform="translate(285, 30)">
    <!-- Phone body -->
    <rect x="0" y="0" width="230" height="440" rx="36" fill="#090514" stroke="#A78BFA" stroke-width="2.5" />
    
    <!-- Dynamic island / speaker -->
    <rect x="75" y="12" width="80" height="18" rx="9" fill="#000000" stroke="#333" stroke-width="0.5" />
    
    <!-- Screen content -->
    <rect x="10" y="40" width="210" height="385" rx="24" fill="#181329" />

    <!-- App Header -->
    <text x="25" y="70" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">NovaStore</text>
    <circle cx="195" cy="65" r="12" fill="#8B5CF6" fill-opacity="0.3" />
    <text x="190" y="70" fill="#FDE68A" font-size="12">🛒</text>

    <!-- Search box -->
    <rect x="25" y="85" width="180" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" />
    <text x="38" y="105" fill="#DDD6FE" font-family="sans-serif" font-size="10">🔍 Cari produk trend...</text>

    <!-- Promo Banner Card -->
    <rect x="25" y="125" width="180" height="75" rx="10" fill="url(#phoneCardGrad)" />
    <text x="38" y="150" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Diskon Spesial 40%</text>
    <text x="38" y="168" fill="#FEF08A" font-family="sans-serif" font-size="10">Koleksi Desain Terbaru</text>

    <!-- Category chips -->
    <rect x="25" y="210" width="55" height="22" rx="11" fill="#8B5CF6" />
    <text x="35" y="225" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">Semua</text>

    <rect x="85" y="210" width="55" height="22" rx="11" fill="#ffffff" fill-opacity="0.1" />
    <text x="96" y="225" fill="#DDD6FE" font-family="sans-serif" font-size="9">Fashion</text>

    <rect x="145" y="210" width="55" height="22" rx="11" fill="#ffffff" fill-opacity="0.1" />
    <text x="156" y="225" fill="#DDD6FE" font-family="sans-serif" font-size="9">Gadget</text>

    <!-- Product Grid Item 1 -->
    <rect x="25" y="245" width="85" height="110" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.3" />
    <rect x="33" y="253" width="69" height="50" rx="6" fill="#8B5CF6" fill-opacity="0.25" />
    <text x="58" y="283" fill="#ffffff" font-size="16">🎧</text>
    <text x="32" y="318" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">Headphone Pro</text>
    <text x="32" y="333" fill="#FCD34D" font-family="sans-serif" font-size="9" font-weight="bold">Rp 349k</text>

    <!-- Product Grid Item 2 -->
    <rect x="120" y="245" width="85" height="110" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.3" />
    <rect x="128" y="253" width="69" height="50" rx="6" fill="#EC4899" fill-opacity="0.25" />
    <text x="153" y="283" fill="#ffffff" font-size="16">⌚</text>
    <text x="127" y="318" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">Smart Band 8</text>
    <text x="127" y="333" fill="#FCD34D" font-family="sans-serif" font-size="9" font-weight="bold">Rp 289k</text>

    <!-- Bottom navigation bar -->
    <rect x="20" y="375" width="190" height="40" rx="12" fill="#0F0C1B" stroke="#ffffff" stroke-opacity="0.1" />
    <circle cx="50" cy="395" r="5" fill="#8B5CF6" />
    <circle cx="95" cy="395" r="5" fill="#ffffff" fill-opacity="0.4" />
    <circle cx="140" cy="395" r="5" fill="#ffffff" fill-opacity="0.4" />
    <circle cx="180" cy="395" r="5" fill="#ffffff" fill-opacity="0.4" />
  </g>

  <!-- Left Floating Card -->
  <g transform="translate(80, 160)">
    <rect width="160" height="90" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="18" y="35" fill="#C4B5FD" font-family="sans-serif" font-size="11" font-weight="bold">Smooth Animation</text>
    <text x="18" y="55" fill="#ffffff" font-family="sans-serif" font-size="12">Interactive Carousel &amp;</text>
    <text x="18" y="72" fill="#FCD34D" font-family="sans-serif" font-size="11">Fluid Transitions</text>
  </g>

  <!-- Right Floating Card -->
  <g transform="translate(560, 240)">
    <rect width="160" height="90" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.4" />
    <text x="18" y="35" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="bold">Cart State Sync</text>
    <text x="18" y="55" fill="#ffffff" font-family="sans-serif" font-size="12">Real-time Subtotal</text>
    <text x="18" y="72" fill="#A78BFA" font-family="sans-serif" font-size="11">&amp; Checkout Mockup</text>
  </g>
</svg>
